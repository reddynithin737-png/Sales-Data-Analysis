{% extends "base.html" %}

{% block title %}Register - Sales Data Analysis System{% endblock %}

{% block content %}
<div class="auth-wrapper" style="max-width: 500px; margin: 2rem auto;">
    <div class="auth-card" style="background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(79, 70, 229, 0.1); border: 1px solid #e0e7ff; overflow: hidden;">
        <div class="auth-header" style="text-align: center; padding: 1.75rem 1.5rem 1.25rem 1.5rem; background: linear-gradient(135deg, #1e1b4b 0%, #312e81 60%, #4338ca 100%); color: #ffffff;">
            <div style="font-size: 2rem; margin-bottom: 0.25rem;">📝</div>
            <h2 style="font-size: 1.6rem; font-weight: 800; margin: 0 0 0.25rem 0; color: #ffffff;">
                Create Your Account
            </h2>
            <p style="color: #e0e7ff; font-size: 0.92rem; margin: 0;">
                Register manually to access your sales dashboard and analytics
            </p>
        </div>

        <div class="auth-body" style="padding: 1.75rem 2rem;">
            <form method="POST" action="{{ url_for('register') }}">
                <!-- Full Name -->
                <div class="form-group" style="margin-bottom: 1.1rem;">
                    <label class="form-label" for="full_name" style="display: block; font-weight: 600; color: #334155; font-size: 0.9rem; margin-bottom: 0.35rem;">
                        Full Name
                    </label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="full_name" 
                        name="full_name" 
                        placeholder="e.g. John Doe" 
                        value="{{ full_name if full_name else '' }}"
                        required
                        autofocus
                        style="width: 100%; padding: 0.75rem 0.9rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;"
                    >
                </div>

                <!-- Email & Username -->
                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-bottom: 1.1rem;">
                    <div class="form-group">
                        <label class="form-label" for="email" style="display: block; font-weight: 600; color: #334155; font-size: 0.9rem; margin-bottom: 0.35rem;">
                            Email Address
                        </label>
                        <input 
                            type="email" 
                            class="form-control" 
                            id="email" 
                            name="email" 
                            placeholder="john@example.com" 
                            value="{{ email if email else '' }}"
                            required
                            style="width: 100%; padding: 0.75rem 0.9rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;"
                        >
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="username" style="display: block; font-weight: 600; color: #334155; font-size: 0.9rem; margin-bottom: 0.35rem;">
                            Username
                        </label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="username" 
                            name="username" 
                            placeholder="e.g. johndoe" 
                            value="{{ username if username else '' }}"
                            required
                            style="width: 100%; padding: 0.75rem 0.9rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;"
                        >
                    </div>
                </div>

                <!-- Passwords -->
                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-bottom: 1.4rem;">
                    <div class="form-group">
                        <label class="form-label" for="password" style="display: block; font-weight: 600; color: #334155; font-size: 0.9rem; margin-bottom: 0.35rem;">
                            Password (min 6 chars)
                        </label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="Create password" 
                            minlength="6"
                            required
                            style="width: 100%; padding: 0.75rem 0.9rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;"
                        >
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirm_password" style="display: block; font-weight: 600; color: #334155; font-size: 0.9rem; margin-bottom: 0.35rem;">
                            Confirm Password
                        </label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="confirm_password" 
                            name="confirm_password" 
                            placeholder="Confirm password" 
                            minlength="6"
                            required
                            style="width: 100%; padding: 0.75rem 0.9rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;"
                        >
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; border-radius: 8px; font-weight: 700;">
                        ✨ Create User Account
                    </button>
                    <a href="{{ url_for('login') }}" class="btn btn-secondary" style="width: 100%; padding: 0.65rem; border-radius: 8px; text-decoration: none; text-align: center;">
                        ← Already Have an Account? Sign In
                    </a>
                </div>
            </form>
        </div>

        <div class="auth-footer" style="background: #f8fafc; border-top: 1px solid #e2e8f0; padding: 1rem 2rem; text-align: center; font-size: 0.88rem; color: #64748b;">
            <p style="margin: 0;">Looking for Admin Access? <a href="{{ url_for('admin_login') }}" style="color: #b45309; font-weight: 700; text-decoration: none;">Admin Login Here</a></p>
        </div>
    </div>
</div>
{% endblock %}
